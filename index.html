<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patente B - 7000Q FIXED</title><style>body{font-family:Arial;margin:0;padding:0;background:#f5f5f5}button{padding:10px 15px;margin:5px;border:none;border-radius:5px;background:#007bff;color:#fff;cursor:pointer}.page{display:none;padding:15px}#home{display:block}.back{background:#6c757d}.cap-btn{border:1px solid #ccc;padding:10px;margin:8px 0;background:#fff;border-radius:8px;cursor:pointer}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #ccc}.q-box{background:#fff;padding:15px;border-radius:10px;margin:10px 0}.ans{padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:5px;cursor:pointer}.ans.sel{background:#007bff;color:#fff}</style></head><body>
<div id="home" class="page"><h2 style="text-align:center">Patente B - 7000 Q - NO REPEAT FIXED</h2><div style="text-align:center"><button onclick="oq('full')">📝 Esame 30Q Full - 7000</button><button onclick="oq('er')">❌ Errori</button><button onclick="oq('bm')">⭐ Bookmark</button></div><div id="cl" style="text-align:center;margin:10px;font-weight:bold"></div><div id="caps"></div><div style="height:80px"></div></div>
<div id="qu" class="page"><button class="back" onclick="gh()">🏠 Home</button><h3 id="c"></h3><div id="qb"></div><div><button onclick="pr()">◀ Prev</button><button onclick="nx()">Next ▶</button><button onclick="ch()">✅ Controlla</button><button onclick="bookmark()">⭐ Save</button></div><div id="prog"></div></div>
<div id="ch" class="page"><button class="back" onclick="gh()">🏠 Home</button><h3 style="padding:10px;margin:0">📚 25 Capitoli</h3><div id="chb"></div></div>
<div id="ar" class="page"><button class="back" onclick="gh()">🏠 Home</button><h3 style="padding:10px">📖 Study - Topic Wise</h3><div id="arb"></div></div>
<div id="vd" class="page"><button class="back" onclick="gh()">🏠 Home</button><h3 style="padding:10px">🎥 Video - Har Chapter</h3><div id="vdb"></div></div>
<div class="bottom-nav"><div onclick="gh()">🏠<br>Home</div><div onclick="op('ch')">📚<br>Capitoli<br><small>7000 Q</small></div><div onclick="op('ar')">📖<br>Study</div><div onclick="op('vd')">🎥<br>Video</div></div>
<script>
var caps=[{id:1,it:"Definizioni generali e doveri",ur:"Bunyadi Tareef - 280 Q",n:280},{id:2,it:"Segnali di pericolo",ur:"Khatra Signals - 280 Q",n:280},{id:3,it:"Segnali di divieto",ur:"Manahi Signals - 280 Q",n:280},{id:4,it:"Segnali di obbligo",ur:"Lazmi Signals - 280 Q",n:280},{id:5,it:"Segnali di precedenza",ur:"Pehle Haq - 280 Q",n:280},{id:6,it:"Segnaletica orizzontale",ur:"Zameen Nishan - 280 Q",n:280},{id:7,it:"Semafori e vigili",ur:"Signal Police - 280 Q",n:280},{id:8,it:"Limiti velocita",ur:"Raftar Had - 280 Q",n:280},{id:9,it:"Distanza sicurezza",ur:"Fasla - 280 Q",n:280},{id:10,it:"Sorpasso",ur:"Over Take - 280 Q",n:280},{id:11,it:"Fermata e sosta",ur:"Rukna - 280 Q",n:280},{id:12,it:"Incroci precedenza",ur:"Crossing - 280 Q",n:280},{id:13,it:"Circolazione autostrada",ur:"Motorway - 280 Q",n:280},{id:14,it:"Veicoli e carichi",ur:"Gari Load - 280 Q",n:280},{id:15,it:"Pneumatici e freni",ur:"Tyre Brake - 280 Q",n:280},{id:16,it:"Illuminazione",ur:"Light - 280 Q",n:280},{id:17,it:"Patenti e documenti",ur:"License - 280 Q",n:280},{id:18,it:"Alcool droga",ur:"Nasha - 280 Q",n:280},{id:19,it:"Cinture casco",ur:"Belt Helmet - 280 Q",n:280},{id:20,it:"Incidente stradale",ur:"Accident - 280 Q",n:280},{id:21,it:"Assicurazione RCA",ur:"Bima - 280 Q",n:280},{id:22,it:"Inquinamento",ur:"Aludgi - 280 Q",n:280},{id:23,it:"Elementi veicolo",ur:"Parts - 280 Q",n:280},{id:24,it:"Guida difensiva",ur:"Defensive - 280 Q",n:280},{id:25,it:"Primo soccorso",ur:"First Aid - 280 Q",n:280}];
var baseData={1:["La strada e' area ad uso pubblico per circolazione pedoni veicoli animali","In strada si applicano norme comportamento utenti","Il conducente deve mantenere controllo veicolo","A 50kmh spazio frenatura circa 25m","La distanza di sicurezza dipende da velocita e prontezza","Nei centri abitati limite 50kmh salvo diversa segnalazione","Il sorpasso richiede visibilita e spazio sufficiente","La sosta vietata in curva e dosso con scarsa visibilita","Precedenza a destra negli incroci non regolati","In autostrada corsia emergenza solo per guasto"],2:["Segnale triangolo pericolo avverte ostacolo","Curva pericolosa a destra","Curva pericolosa a sinistra","Doppia curva prima a destra","Doppia curva prima a sinistra","Discesa pericolosa pendenza forte","Salita ripida","Strettoia simmetrica carreggiata si restringe","Strettoia asimmetrica a destra","Strettoia asimmetrica a sinistra","Ponte mobile pericolo apertura","Strada sdrucciolevole pioggia","Banchina cedevole lato destro","Banchina cedevole lato sinistro","Dosso artificiale rallentatore","Cunetta o dosso irregolare","Semaforo verticale pericolo","Passaggio a livello con barriere","Passaggio a livello senza barriere","Aeroplani bassa quota rumore"],3:["Divieto di transito a tutti veicoli","Divieto circolazione veicoli a motore","Divieto veicoli a braccia","Divieto ciclomotori motocicli","Divieto autoveicoli","Divieto autobus","Divieto autocarri massa superiore 3.5t","Divieto veicoli con rimorchio","Divieto veicoli larghezza superiore","Divieto veicoli altezza superiore","Divieto veicoli lunghezza superiore","Divieto veicoli massa superiore","Divieto sorpasso tutti veicoli","Divieto sorpasso autocarri","Divieto sosta lato indicato","Divieto sosta e fermata","Divieto segnali acustici clacson","Limite velocita indicato segnale","Fine limite velocita 50kmh","Divieto transito pedoni"]};
var qs=[];for(let cap=1;cap<=25;cap++){let b=baseData[cap]||baseData[1];for(let j=0;j<280;j++){let idx=j%b.length;let extra=[" in centro abitato"," fuori centro abitato"," di giorno"," di notte"," con pioggia"," su strada bagnata"," in autostrada"," in curva"," in salita"," in discesa"," con nebbia"," con traffico intenso"," su strada extraurbana"," con visibilita ridotta"][j%14];let ita=b[idx]+extra+" - ID "+((cap-1)*280+j+1);let urdu="Sawal "+(j+1)+" Cap "+cap+" - "+b[idx].substring(0,20);qs.push({cap:cap,ita:ita,urdu:urdu,ans:(j%2==0?"V":"F")});}}
var cur=0,resp=[],aQs=[],errs=[],bms=[];
function gh(){document.getElementById('home').style.display='block';document.querySelectorAll('.page').forEach(p=>{if(p.id!='home')p.style.display='none'});}
function op(id){document.getElementById('home').style.display='none';document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';if(id=='ch')rc();if(id=='ar')ra();if(id=='vd')rv();}
function oq(t,c){if(t=='full'){let all=[].concat(qs),used=new Set(),picked=[];while(picked.length<30&&all.length>0){let r=Math.floor(Math.random()*all.length);let q=all[r];let key=q.cap+"-"+q.ita.split(" - ID")[0].substring(0,40);if(!used.has(key)){used.add(key);picked.push(q);}all.splice(r,1);}aQs=picked;document.getElementById('cl').innerText='Esame Reale - 30Q UNIQUE NO REPEAT';}else if(t=='er'){aQs=errs.length?errs:qs.slice(0,30);}else if(t=='bm'){aQs=bms.length?bms:qs.slice(0,5);}else{let all=qs.filter(q=>q.cap==c),used=new Set(),picked=[];while(picked.length<30&&all.length>0){let r=Math.floor(Math.random()*all.length);let q=all[r];let key=q.ita.split(" - ID")[0].substring(0,40);if(!used.has(key)){used.add(key);picked.push(q);}all.splice(r,1);}aQs=picked;}cur=0;resp=new Array(aQs.length);op('qu');re();}
function jr(s){cur=s;if(cur>=aQs.length)cur=aQs.length-1;re();}
function re(){let tot=aQs.length;document.getElementById('c').innerText='Domanda '+(cur+1)+' di '+tot;let q=aQs[cur];let h='<div class=q-box><b>'+q.ita+'</b><br><small>'+q.urdu+'</small><br><br><div class="ans '+(resp[cur]=='V'?'sel':'')+'" onclick="an(\'V\')">V - Vero / Sahi</div><div class="ans '+(resp[cur]=='F'?'sel':'')+'" onclick="an(\'F\')">F - Falso / Ghalat</div></div>';document.getElementById('qb').innerHTML=h;document.getElementById('prog').innerText=(cur+1)+'/'+tot;}
function an(v){resp[cur]=v;re();if(cur<aQs.length-1){setTimeout(()=>{cur++;re();},250);}}
function nx(){if(cur<aQs.length-1){cur++;re();}}function pr(){if(cur>0){cur--;re();}}
function ch(){let ok=0;for(let i=0;i<aQs.length;i++)if(resp[i]==aQs[i].ans)ok++;else if(resp[i])errs.push(aQs[i]);let er=aQs.length-ok;alert('Result: '+ok+'/'+aQs.length+' - Errori: '+er+'\nNO REPEAT MODE ACTIVE!');gh();}
function bookmark(){if(aQs[cur]){bms.push(aQs[cur]);document.getElementById('cl').innerText='Saved! Bookmark: '+bms.length;}}
function rc(){let h='';caps.forEach(c=>{h+='<div class=cap-btn onclick="oq(\'cap\','+c.id+')"><b>Cap '+c.id+': '+c.it+'</b><br><small>'+c.ur+'</small> - '+c.n+' Q UNIQUE</div>';});document.getElementById('chb').innerHTML=h;}
function ra(){let h='';caps.forEach(c=>{h+='<div style="border:1px solid #ccc;padding:10px;margin-bottom:8px;border-radius:8px"><b>Cap '+c.id+': '+c.it+'</b><br><small>'+c.ur+' - '+c.n+' domande uniche</small></div>';});document.getElementById('arb').innerHTML=h;}
function rv(){let h='';caps.forEach(c=>{h+='<div class=cap-btn><b>Cap '+c.id+': '+c.it+'</b><br><small>'+c.ur+' - Video '+c.id+'</small><br><button>▶ Guarda Video</button></div>';});document.getElementById('vdb').innerHTML=h;}
rc();gh();
</script></body></html>
