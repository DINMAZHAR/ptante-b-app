<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azhar Patente B</title><style>body{margin:0;font-family:Arial;background:#f0f0f0}#header{background:linear-gradient(to right,#009246 33%,#fff 33%,#fff 66%,#ce2b37 66%);padding:10px;text-align:center;border-bottom:3px solid #000}.header-box{background:#fff;display:inline-block;padding:5px 15px;border-radius:10px;border:2px solid #000;font-weight:bold}#box{max-width:800px;margin:10px auto;background:#fff;border:2px solid #009246;border-radius:10px;overflow:hidden}.top{display:flex}.top div{flex:1;padding:8px;text-align:center;background:#ddd;font-size:11px;cursor:pointer;border:1px solid #999}.top div.activeT{background:#222;color:#fff}.num{display:flex;flex-wrap:wrap}.num div{flex:0 0 10%;padding:8px 0;text-align:center;border:1px solid #ddd;cursor:pointer;font-weight:bold}.num div.active{background:#222;color:#fff}.main{display:flex}.left{width:40%;padding:10px;text-align:center;border-right:1px solid #999;background:#fafafa}.right{width:60%;padding:10px}.urdu{color:#b00000;background:#fff0f0;padding:6px;margin-top:8px;font-weight:bold;font-size:12px;border-radius:5px}.vf{display:flex;gap:15px;justify-content:center;margin-top:20px}.vf button{width:60px;height:60px;border-radius:50%;font-size:22px;font-weight:bold;border:3px solid #333;background:#fff;cursor:pointer}.vf button.sel{background:#4CAF50;color:#fff}.foot{display:flex;justify-content:space-between;padding:8px;background:#e8efe8;border-top:2px solid #009246}#homePage{max-width:800px;margin:auto;background:#fff;min-height:100vh}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{border:2px solid #009246;border-radius:10px;padding:15px;text-align:center;cursor:pointer;background:#fff}.card.full{grid-column:1/-1;background:#009246;color:#fff}.page{display:none;max-width:800px;margin:auto;background:#fff;padding:10px;min-height:100vh}.back{background:#ce2b37;color:#fff;border:none;padding:6px 12px;border-radius:20px;cursor:pointer}.cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cap-btn{border:1.5px solid #009246;border-radius:8px;padding:8px;cursor:pointer;background:#fff}.bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;max-width:800px;margin:auto;background:#fff;border-top:2px solid #009246}.bottom-nav div{flex:1;text-align:center;padding:6px;font-size:10px;cursor:pointer}.sign{width:150px;height:110px;margin:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;border:4px solid;border-radius:12px;text-align:center}.s-yellow{background:#ffeb3b;border-color:#000;color:#000}.s-red{background:red;color:#fff;border-color:#000;font-size:26px}.s-white{background:#fff;border-color:red;color:red;border-width:6px;border-radius:50%}.s-limit{background:#fff;border-color:#000;color:#000;border-width:4px;border-radius:50%;font-size:32px}</style></head><body>
<div id="homePage"><div id="header"><div class="header-box">🇮🇹 AZHAR UDEEN - PATENTE B 🇮🇹</div></div><div style="background:#009246;color:#fff;text-align:center;padding:8px;font-weight:bold">FINAL 100% - Bina bg.jpg ke - Pics Andar Se</div><div class="home-grid"><div class="card full" onclick="openQuiz('full')"><div style="font-size:28px">📝</div><b>Quiz Esame Reale - 15 Q</b><br><small>Har Pic 100% Show Hogi</small></div><div class="card" onclick="openPage('chapters')"><div style="font-size:24px">📚</div><b>Capitoli</b></div><div class="card" onclick="openPage('argomenti')"><div style="font-size:24px">🎓</div><b>Study</b></div></div></div>
<div id="quizPage" class="page"><button class="back" onclick="goHome()">← Home</button><div id="box"><div class="top"><div id="t1" class="activeT" onclick="jumpRange(0)">1-10</div><div id="t2" onclick="jumpRange(10)">11-15</div></div><div class="num" id="nums"></div><div class="main"><div class="left"><div id="pic"></div><div style="margin-top:10px">Timer <b id="timer" style="color:red">20:00</b><div id="capLabel" style="font-size:10px;color:green;font-weight:bold"></div></div></div><div class="right"><b id="c"></b><p id="q" style="font-weight:bold;font-size:13px;margin-top:8px"></p><div class="urdu" id="qu"></div><div class="vf"><button id="bV" onclick="ans('V')">V</button><button id="bF" onclick="ans('F')">F</button></div></div></div><div class="foot"><button onclick="prev()">◀ Prev</button><button onclick="check()" style="background:#009246;color:#fff;border:none;padding:6px 12px;border-radius:5px;font-weight:bold">Correggi</button><button onclick="next()">Next ▶</button></div></div></div>
<div id="chapters" class="page"><button class="back" onclick="goHome()">← Home</button><h3>📚 Capitoli</h3><div id="capList" class="cap-grid"></div></div>
<div id="argomenti" class="page"><button class="back" onclick="goHome()">← Home</button><h3>🎓 Study</h3><div id="argList"></div></div>
<div class="bottom-nav"><div onclick="goHome()" id="nav-home">🏠 Home</div><div onclick="openPage('chapters')">📚 Capitoli</div><div onclick="openPage('argomenti')">🎓 Study</div></div>
<script>
var capitoli=[{id:1,it:"Definizioni",ur:"Bunyadi",d:"Strada"},{id:2,it:"Pericolo",ur:"Khatre",d:"Dosso, curva"},{id:3,it:"Precedenza",ur:"Precedenza",d:"STOP"},{id:4,it:"Divieto",ur:"Mana",d:"Divieto"},{id:11,it:"Limiti",ur:"Raftar",d:"50,130"}];
var qs=[
{ita:"La strada e' area pubblica per pedoni veicoli animali",urdu:"Sarak aam jagah hai",ans:"V",cap:1,sign:"<div class='sign s-limit'>STRADA</div>"},
{ita:"Il segnale di dosso indica dosso artificiale - rallentare",urdu:"Dosso speed breaker - slow",ans:"V",cap:2,sign:"<div class='sign s-yellow'>⚠️ DOSSO</div>"},
{ita:"Il segnale di curva pericolosa a destra preannuncia una curva stretta a destra",urdu:"Dayen mod khatarnak ka nishan",ans:"V",cap:2,sign:"<div class='sign s-yellow'>↗️ CURVA DX</div>"},
{ita:"Il segnale di dare precedenza ha forma triangolo rovesciato bianco con bordo rosso",urdu:"Dare precedenza ulta triangle",ans:"V",cap:3,sign:"<div class='sign s-white' style='border-radius:0;clip-path:polygon(50% 0%,0% 100%,100% 100%);background:#fff;border:4px solid red;color:red'>PRECEDENZA</div>"},
{ita:"STOP obbliga fermarsi e dare precedenza - forma ottagonale",urdu:"STOP par rukna zaroori - 8 kona",ans:"V",cap:3,sign:"<div class='sign s-red' style='border-radius:0;clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%)'>STOP</div>"},
{ita:"Divieto di transito vieta a tutti i veicoli - cerchio bianco con bordo rosso",urdu:"Sab gari mana - laal circle",ans:"V",cap:4,sign:"<div class='sign s-white'>⛔ DIVIETO</div>"},
{ita:"Divieto di sorpasso vieta sorpasso veicoli a motore",urdu:"Overtake karna mana hai",ans:"V",cap:4,sign:"<div class='sign s-white'>🚫 SORPASSO</div>"},
{ita:"Limite 50 km/h nei centri abitati - limite massimo",urdu:"Sheher me 50 limit",ans:"V",cap:11,sign:"<div class='sign s-limit'>50</div>"},
{ita:"Limite 130 km/h in autostrada per autovetture",urdu:"Autostrada 130 limit",ans:"V",cap:11,sign:"<div class='sign s-limit'>130</div>"},
{ita:"Neopatentati 100 km/h in autostrada per 3 anni",urdu:"Naye driver 100 limit 3 saal",ans:"V",cap:11,sign:"<div class='sign s-limit'>100</div>"},
{ita:"Distanza di sicurezza regola 2 secondi da mantenere",urdu:"Fasla 2 second ka rakho",ans:"V",cap:1,sign:"<div class='sign s-limit'>2s</div>"},
{ita:"Cintura di sicurezza obbligatoria su tutte le strade",urdu:"Belt pehanna lazmi har jagah",ans:"V",cap:1,sign:"<div class='sign s-limit'>🔒 BELT</div>"},
{ita:"Cellulare vietato senza viva voce o auricolare",urdu:"Mobile use karna mana",ans:"V",cap:1,sign:"<div class='sign s-white'>📵 CELL</div>"},
{ita:"RCA assicurazione obbligatoria per circolare",urdu:"Bima lazmi hai gaari ke liye",ans:"V",cap:1,sign:"<div class='sign s-limit'>RCA</div>"},
{ita:"Tasso alcolemico massimo 0,5 g/l per guidare",urdu:"Sharab 0.5 se zyada to mana",ans:"V",cap:1,sign:"<div class='sign s-white'>0.5</div>"}
];
var cur=0,time=1200,risp=[],activeQs=[],timerInt=null;
function goHome(){document.getElementById('homePage').style.display='block';document.querySelectorAll('.page').forEach(p=>p.style.display='none');}
function openPage(id){document.getElementById('homePage').style.display='none';document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';}
function openQuiz(type,capId){if(type=='full'){activeQs=[].concat(qs).sort(()=>0.5-Math.random()).slice(0,15);document.getElementById('capLabel').innerText='Full Book 15 Q';}else{activeQs=qs.filter(q=>q.cap==capId);document.getElementById('capLabel').innerText='Cap '+capId;}cur=0;risp=new Array(activeQs.length).fill(null);time=1200;openPage('quizPage');render();if(timerInt)clearInterval(timerInt);timerInt=setInterval(()=>{let m=Math.floor(time/60),s=time%60;document.getElementById('timer').innerText=(m<10?"0"+m:m)+":"+(s<10?"0"+s:s);if(time>0)time--;},1000);}
function jumpRange(s){cur=s;if(cur>=activeQs.length)cur=activeQs.length-1;render();}
function render(){let total=activeQs.length;document.getElementById('c').innerText="Domanda "+(cur+1)+" di "+total;document.getElementById('q').innerText=activeQs[cur].ita;document.getElementById('qu').innerText=activeQs[cur].urdu;document.getElementById('pic').innerHTML=activeQs[cur].sign;let n=document.getElementById('nums');n.innerHTML="";let start=Math.floor(cur/10)*10;for(let i=start;i<Math.min(start+10,total);i++){let d=document.createElement('div');d.innerText=i+1;if(i==cur)d.className='active';if(risp[i])d.style.background='#a5d6a7';d.onclick=((idx)=>()=>{cur=idx;render();})(i);n.appendChild(d);}document.querySelectorAll('.top div').forEach(d=>d.classList.remove('activeT'));let tIdx=Math.floor(cur/10);if(document.getElementById('t'+(tIdx+1)))document.getElementById('t'+(tIdx+1)).classList.add('activeT');document.getElementById('bV').className=risp[cur]=='V'?'sel':'';document.getElementById('bF').className=risp[cur]=='F'?'sel':'';}
function ans(v){risp[cur]=v;render();if(cur<activeQs.length-1){setTimeout(()=>{cur++;render();},300);}}
function next(){if(cur<activeQs.length-1){cur++;render();}}function prev(){if(cur>0){cur--;render();}}
function check(){let ok=0;for(let i=0;i<activeQs.length;i++)if(risp[i]==activeQs[i].ans)ok++;let err=activeQs.length-ok;alert("Sahi: "+ok+"/"+activeQs.length+"\nGhalat: "+err+"\n"+(err<=3?"PROMOSSO - Mubarak!":"BOCCIATO"));}
function renderChapters(){let h='';capitoli.forEach(c=>{let cnt=qs.filter(q=>q.cap==c.id).length;h+=`<div class='cap-btn' onclick="openQuiz('cap',${c.id})"><b>Cap ${c.id} - ${c.ur} (${cnt} Q)</b><span>${c.it}</span></div>`;});document.getElementById('capList').innerHTML=h;let a='';capitoli.forEach(c=>{a+=`<div style='border:1px solid #ccc;padding:6px;margin-bottom:6px'><b>Cap ${c.id}: ${c.it}</b> - ${c.ur}<br><button onclick="openQuiz('cap',${c.id})" style='background:#009246;color:#fff;border:none;padding:4px 8px;border-radius:4px;margin-top:4px'>Quiz ${c.ur}</button></div>`;});document.getElementById('argList').innerHTML=a;}
renderChapters();goHome();
</script></body></html>
