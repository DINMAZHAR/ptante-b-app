<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patente B - Azhar App</title>
<style>
body{font-family:sans-serif; text-align:center; background:#eef6ff; padding:10px}
.card{background:white; border-radius:20px; padding:15px; max-width:400px; margin:auto; box-shadow:0 5px 15px #999}
img{width:100%; height:220px; object-fit:cover; border-radius:12px; border:2px solid #333}
button{width:48%; padding:14px; margin:5px 1%; font-size:17px; border-radius:10px; border:none; background:#007bff; color:white; font-weight:bold}
#urdu{color:#c00000; font-weight:bold; background:#fff0f0; padding:8px; border-radius:8px}
#next{background:#28a745; width:100%; margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:5px">🇮🇹 Patente B Quiz 🇵🇰</h2>
<img id="pic" src="">
<p id="ita" style="font-weight:bold; font-size:18px"></p>
<p id="urdu"></p>
<button onclick="check(true)">Vero</button>
<button onclick="check(false)">Falso</button>
<h3 id="res"></h3>
<button id="next" onclick="nextQ()">Agla Sawal ➡️</button>
<p id="count"></p>
</div>

<script>
let qs=[
{img:"https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500", ita:"Il segnale indica STOP - Fermarsi e dare precedenza", urdu:"Is nishaan ka matlab hai - Ruk jao aur rasta do", ans:true},
{img:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=500", ita:"Il segnale indica divieto di sosta", urdu:"Yahan gari khari karna mana hai", ans:true},
{img:"https://images.unsplash.com/photo-1591088398332-8a7791972843?w=500", ita:"Il limite di velocità in città è 150 km/h", urdu:"Sheher me speed limit 150 hai", ans:false},
{img:"https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=500", ita:"Con la patente B si può guidare un'autovettura", urdu:"Patente B se car chala sakte hain", ans:true}
];
let i=0;
function loadQ(){
 document.getElementById('pic').src=qs[i].img;
 document.getElementById('ita').innerText=qs[i].ita;
 document.getElementById('urdu').innerText=qs[i].urdu;
 document.getElementById('res').innerText="";
 document.getElementById('count').innerText=`Sawal ${i+1} / ${qs.length}`;
}
function check(v){
 if(v==qs[i].ans) document.getElementById('res').innerHTML="✅ Shabash! Sahi Jawab!";
 else document.getElementById('res').innerHTML="❌ Ghalat! Soch ke jawab do";
}
function nextQ(){ i=(i+1)%qs.length; loadQ(); }
loadQ();
</script>
</body>
</html>
