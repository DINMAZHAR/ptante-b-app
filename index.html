<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Patente B - Azhar</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}.header{background:#1e293b;padding:15px;text-align:center;border-bottom:3px solid #22c55e}.header h1{color:#22c55e;font-size:24px}.container{max-width:600px;margin:0 auto;padding:15px}.card{background:#1e293b;border-radius:16px;padding:20px;margin-top:15px;border:1px solid #334155}.stats{display:flex;justify-content:space-between;background:#0f172a;padding:12px;border-radius:10px;margin-bottom:15px}.question-box{font-size:18px;line-height:1.5;margin:15px 0}.urdu{color:#fbbf24;font-size:15px;margin-top:10px;background:#0f172a;padding:10px;border-radius:8px;border-left:3px solid #fbbf24}.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.btn{padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer}.btn-vero{background:#22c55e;color:#000}.btn-falso{background:#ef4444;color:white}.btn-next{background:#3b82f6;color:white;width:100%;margin-top:12px;display:none}.progress{height:8px;background:#334155;border-radius:10px;overflow:hidden;margin:10px 0}.progress-bar{height:100%;background:#22c55e;width:0%;transition:0.3s}.timer{color:#f87171;font-weight:bold}</style></head><body><div class="header"><h1>🚗 Patente B - by Azhar</h1><p>30 Domande | Max 3 Errori | 20 Min | Urdu</p></div><div class="container"><div class="card"><div class="stats"><span>Q: <b id="qnum">1/30</b></span><span>Err: <b id="err">0/3</b></span><span class="timer" id="timer">20:00</span></div><div class="progress"><div class="progress-bar" id="pbar"></div></div><div id="quiz"><div class="question-box" id="question">Loading...</div><div class="urdu" id="urdu"></div><div class="btns"><button class="btn btn-vero" onclick="answer(true)">VERO ✅</button><button class="btn btn-falso" onclick="answer(false)">FALSO ❌</button></div><button class="btn btn-next" id="nextBtn" onclick="nextQ()">Prossima ➡️</button></div><div id="final" style="display:none"></div></div></div><script>
const questions=[{q:"In presenza del segnale raffigurato è obbligatorio svoltare a destra",u:"Is nishan ka matlab dahine mudna lazmi hai",a:false},{q:"Nei centri abitati il limite massimo è 50 km/h",u:"Sheher me limit 50 hai",a:true},{q:"La distanza di sicurezza deve evitare collisione",u:"Agle gari se fasla rakho takkar na ho",a:true},{q:"Il sorpasso è vietato vicino a dosso",u:"Dosso ke paas overtake mana",a:true},{q:"Tasso alcolemico neopatentati è 0 g/l",u:"Naye driver ke liye sharab 0 hai",a:true},{q:"Cintura solo davanti",u:"Belt sirf aage - ye ghalat hai",a:false},{q:"Fermarsi e soccorso in incidente obbligatorio",u:"Hadse par rukna madad karna lazmi",a:true},{q:"Sosta in seconda fila con frecce consentita",u:"Double parking indicator se bhi mana",a:false},{q:"STOP sempre obbligatorio fermarsi",u:"STOP par hamesha rukna",a:true},{q:"Patente B fino a 3500 kg",u:"B se 3500 kg tak gari",a:true},{q:"Telefonare senza vivavoce vietato",u:"Bina handsfree phone mana",a:true},{q:"Triangolo a 50 metri",u:"Triangle 50m peeche",a:true},{q:"Nebbia <50m anabbaglianti e fendinebbia",u:"Ghari dhund me light jalao",a:true},{q:"Giallo fisso fermarsi se possibile in sicurezza",u:"Peeli batti par ruko agar mehfooz",a:true},{q:"Revisione dopo 4 anni poi ogni 2",u:"Pehli checking 4 saal baad phir har 2",a:true},{q:"Limite autostrada 130 km/h",u:"Highway par 130",a:true},{q:"Rimorchio leggero con B",u:"B se halka trailer 750kg",a:true},{q:"Precedenza pedoni su strisce",u:"Zebra par paidal ko rasta do",a:true},{q:"Frenata aumenta su bagnato",u:"Geeli sadak par brake lambi",a:true},{q:"Giubbotto alta visibilità in autostrada notte obbligatorio",u:"Highway raat ko jacket lazmi",a:true},{q:"Neopatentati max 100 in autostrada",u:"Naye driver 100 max highway",a:true},{q:"Striscia bianca continua non superabile",u:"Lagatar safed lakeer cross mana",a:true},{q:"Casco obbligatorio solo conducente",u:"Helmet sirf driver - ghalat, pillion ko bhi",a:false},{q:"Precedenza a destra in rotatoria",u:"Gol chakkar me right rule nahi",a:false},{q:"Sosta davanti passi carrabili vietata",u:"Passo carrabile ke samne rokna mana",a:true},{q:"Pneumatico sgonfio aumenta consumo",u:"Kam hawa se petrol zyada",a:true},{q:"Limite con pioggia in autostrada 110",u:"Barish me highway 110",a:true},{q:"Doppia fila mai consentita",u:"Double line kabhi jaiz nahi",a:false},{q:"Chiamare 112 in incidente",u:"Hadse par 112 call karo",a:true},{q:"Patente a punti iniziale 20",u:"Points 20 se start",a:true}];
let cur=0,errors=0,time=1200,timerInt,answered=false;
function loadQ(){if(cur>=questions.length){endQuiz(true);return;}answered=false;document.getElementById('qnum').textContent=`${cur+1}/30`;document.getElementById('err').textContent=`${errors}/3`;document.getElementById('pbar').style.width=`${(cur/30)*100}%`;document.getElementById('question').textContent=questions[cur].q;document.getElementById('urdu').textContent="🇵🇰 Urdu: "+questions[cur].u;document.getElementById('nextBtn').style.display='none';document.getElementById('question').style.color='#e2e8f0';}
function answer(val){if(answered)return;answered=true;clearInterval(timerInt);let correct=questions[cur].a;let qBox=document.getElementById('question');if(val===correct){qBox.style.color='#22c55e';qBox.textContent+=" ✅ GIUSTO!";}else{errors++;qBox.style.color='#ef4444';qBox.textContent+=" ❌ SBAGLIATO! Corretta: "+(correct?'VERO':'FALSO');document.getElementById('err').textContent=`${errors}/3`;if(errors>3){setTimeout(()=>endQuiz(false),1500);return;}}document.getElementById('nextBtn').style.display='block';}
function nextQ(){cur++;loadQ();}
function endQuiz(finished){document.getElementById('quiz').style.display='none';let finalDiv=document.getElementById('final');finalDiv.style.display='block';if(errors<=3&&finished){finalDiv.innerHTML=`<div style="color:#22c55e;text-align:center;font-size:22px">🎉 PROMOSSO!<br>Errori: ${errors}/3<br><br><button class="btn btn-vero" style="width:100%" onclick="location.reload()">Ricomincia</button></div>`;}else{finalDiv.innerHTML=`<div style="color:#ef4444;text-align:center;font-size:22px">❌ BOCCIATO<br>Errori: ${errors}/3<br><br><button class="btn btn-falso" style="width:100%" onclick="location.reload()">Riprova</button></div>`;}}
loadQ();
setInterval(()=>{time--;let m=Math.floor(time/60),s=time%60;document.getElementById('timer').textContent=`${m}:${s<10?'0':''}${s}`;if(time<=0)endQuiz(false);},1000);
</script></body></html>
