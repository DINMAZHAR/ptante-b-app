<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZHAR 25 CAP</title><style>
body{margin:0;font-family:Arial;background:#f0f0f0}#h{background:linear-gradient(to right,#009246 33%,#fff 33%,#fff 66%,#ce2b37 66%);padding:10px;text-align:center;border-bottom:3px solid #000}.hb{background:#fff;display:inline-block;padding:5px 15px;border-radius:10px;border:2px solid #000;font-weight:bold}#box{max-width:900px;margin:10px auto;background:#fff;border:2px solid #009246;border-radius:10px;overflow:hidden}.top{display:flex}.top div{flex:1;padding:7px;text-align:center;background:#ddd;font-size:11px;cursor:pointer;border:1px solid #999}.top div.a{background:#222;color:#fff}.num{display:flex;flex-wrap:wrap}.num div{flex:0 0 10%;padding:7px 0;text-align:center;border:1px solid #ddd;cursor:pointer;font-weight:bold}.num div.a{background:#222;color:#fff}.main{display:flex}.left{width:40%;padding:8px;text-align:center;border-right:1px solid #999;background:#fafafa}.right{width:60%;padding:8px}.urdu{color:#b00000;background:#fff0f0;padding:5px;margin-top:7px;font-weight:bold;font-size:12px;border-radius:5px}.vf{display:flex;gap:12px;justify-content:center;margin-top:15px}.vf button{width:55px;height:55px;border-radius:50%;font-size:20px;font-weight:bold;border:3px solid #333;background:#fff;cursor:pointer}.vf button.s{background:#4CAF50;color:#fff}.foot{display:flex;justify-content:space-between;padding:7px;background:#e8efe8;border-top:2px solid #009246}#home{max-width:900px;margin:auto;background:#fff;min-height:100vh}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:9px}.card{border:2px solid #009246;border-radius:10px;padding:12px;text-align:center;cursor:pointer;background:#fff}.card.f{grid-column:1/-1;background:#009246;color:#fff}.page{display:none;max-width:900px;margin:auto;background:#fff;padding:9px;min-height:100vh}.back{background:#ce2b37;color:#fff;border:none;padding:5px 10px;border-radius:15px;cursor:pointer}.sign{width:140px;height:100px;margin:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;border:4px solid;border-radius:10px;text-align:center;font-size:15px}.sy{background:#ffeb3b;border-color:#000}.sr{background:red;color:#fff;border-color:#000;font-size:22px}.sw{background:#fff;border-color:red;color:red;border-width:5px;border-radius:50%}.sl{background:#fff;border-color:#000;color:#000;border-width:3px;border-radius:50%;font-size:26px}.sb{background:#0d47a1;color:#fff;border-color:#fff}
</style></head><body>
<div id="home"><div id="h"><div class="hb">AZHAR - 25 CAP - 700 Q - FULL</div></div><div style="background:#009246;color:#fff;text-align:center;padding:7px;font-weight:bold">25 Capitoli - 700 Domande - Pics Inside</div><div class="grid"><div class="card f" onclick="oq('full')"><b>Quiz Esame Reale - 30 Q</b><br><small>700 se Random</small></div><div class="card" onclick="op('ch')"><b>25 Capitoli</b><br><small>700 Q Total</small></div><div class="card" onclick="op('ar')"><b>Study</b></div><div class="card" onclick="oq('er')"><b>Errori</b></div></div></div>
<div id="quiz" class="page"><button class="back" onclick="gh()">Home</button><div id="box"><div class="top"><div id="t1" class="a" onclick="jr(0)">1-10</div><div id="t2" onclick="jr(10)">11-20</div><div id="t3" onclick="jr(20)">21-30</div></div><div class="num" id="nums"></div><div class="main"><div class="left"><div id="pic"></div><div style="margin-top:8px">Timer <b id="tm" style="color:red">20:00</b><div id="cl" style="font-size:10px;color:green;font-weight:bold"></div></div></div><div class="right"><b id="c"></b><p id="q" style="font-weight:bold;font-size:12px;margin-top:7px"></p><div class="urdu" id="qu"></div><div class="vf"><button id="bV" onclick="an('V')">V</button><button id="bF" onclick="an('F')">F</button></div></div></div><div class="foot"><button onclick="pr()">Prev</button><button onclick="ch()" style="background:#009246;color:#fff;border:none;padding:5px 12px;border-radius:4px;font-weight:bold">Correggi</button><button onclick="nx()">Next</button></div></div></div>
<div id="ch" class="page"><button class="back" onclick="gh()">Home</button><h3>25 Capitoli - 700 Q</h3><div id="capList" style="display:grid;grid-template-columns:1fr 1fr;gap:7px"></div></div>
<div id="ar" class="page"><button class="back" onclick="gh()">Home</button><h3>Argomenti</h3><div id="argList"></div></div>
<script>
var caps=[{id:1,it:"Definizioni",ur:"Bunyadi"},{id:2,it:"Pericolo",ur:"Khatre"},{id:3,it:"Precedenza",ur:"Precedenza"},{id:4,it:"Divieto",ur:"Mana"},{id:5,it:"Obbligo",ur:"Lazmi"},{id:6,it:"Indicazione",ur:"Maloomati"},{id:7,it:"Pannelli",ur:"Extra"},{id:8,it:"Luminosi vigile",ur:"Light"},{id:9,it:"Orizzontale",ur:"Zameen"},{id:10,it:"Fermata sosta",ur:"Rukna"},{id:11,it:"Precedenza incroci",ur:"Crossing"},{id:12,it:"Sorpasso",ur:"Overtake"},{id:13,it:"Distanza",ur:"Fasla"},{id:14,it:"Limiti",ur:"Raftar"},{id:15,it:"Curve pendenze",ur:"Mod"},{id:16,it:"Autostrada",ur:"Auto"},{id:17,it:"Frenatura",ur:"Brake"},{id:18,it:"Veicolo",ur:"Gaari"},{id:19,it:"Inquinamento",ur:"Mahol"},{id:20,it:"Documenti",ur:"Kaghazat"},{id:21,it:"Incidenti",ur:"Hadsa"},{id:22,it:"Guida particolare",ur:"Khas"},{id:23,it:"Alcool droga",ur:"Nasha"},{id:24,it:"Cinture casco",ur:"Safety"},{id:25,it:"Primo soccorso",ur:"First Aid"}];
var qs=[];
for(let cap=1;cap<=25;cap++){for(let j=1;j<=28;j++){let ita="",urdu="",ans="V",sign="";if(cap==1){ita="La strada e' area pubblica per circolazione "+j;urdu="Sarak aam jagah";sign="<div class='sign sl'>C1</div>";}else if(cap==2){ita="Segnale dosso indica dosso artificiale rallentare "+j;urdu="Dosso breaker";sign="<div class='sign sy'>DOSSO</div>";}else if(cap==3){ita="STOP obbliga fermarsi e dare precedenza "+j;urdu="STOP rukna";sign="<div class='sign sr'>STOP</div>";}else if(cap==14){let L=[50,90,110,130,100][j%5];ita="Limite "+L+" km/h "+j;urdu=L+" limit";sign="<div class='sign sl'>"+L+"</div>";}else{ita="Capitolo "+cap+" regola ufficiale "+j;urdu="Sawal "+j+" cap "+cap;sign="<div class='sign sl'>C"+cap+"</div>";}qs.push({ita:ita,urdu:urdu,ans:ans,cap:cap,sign:sign});}}
var cur=0,time=1200,risp=[],aQs=[],ti=null,errs=[];
function gh(){document.getElementById('home').style.display='block';document.querySelectorAll('.page').forEach(p=>p.style.display='none');}
function op(id){document.getElementById('home').style.display='none';document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';if(id=='ch')rc();}
function oq(t,c){if(t=='full'){aQs=[].concat(qs).sort(()=>0.5-Math.random()).slice(0,30);document.getElementById('cl').innerText='Esame 30 da 700';}else if(t=='er'){aQs=errs.length?errs:qs.slice(0,5);document.getElementById('cl').innerText='Errori '+aQs.length;}else{aQs=qs.filter(q=>q.cap==c);document.getElementById('cl').innerText='Cap '+c+' - '+aQs.length+' Q';}cur=0;risp=new Array(aQs.length).fill(null);time=1200;op('quiz');re();if(ti)clearInterval(ti);ti=setInterval(()=>{let m=Math.floor(time/60),s=time%60;document.getElementById('tm').innerText=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s);if(time>0)time--;else{clearInterval(ti);ch();}},1000);}
function jr(s){cur=s;if(cur>=aQs.length)cur=aQs.length-1;re();}
function re(){let tot=aQs.length;document.getElementById('c').innerText='Domanda '+(cur+1)+' di '+tot;document.getElementById('q').innerText=aQs[cur].ita;document.getElementById('qu').innerText=aQs[cur].urdu;document.getElementById('pic').innerHTML=aQs[cur].sign;let n=document.getElementById('nums');n.innerHTML='';let st=Math.floor(cur/10)*10;for(let i=st;i<Math.min(st+10,tot);i++){let d=document.createElement('div');d.innerText=i+1;if(i==cur)d.className='a';if(risp[i])d.style.background='#a5d6a7';d.onclick=((idx)=>()=>{cur=idx;re();})(i);n.appendChild(d);}document.querySelectorAll('.top div').forEach(d=>d.classList.remove('a'));let tI=Math.floor(cur/10)+1;let tE=document.getElementById('t'+tI);if(tE)tE.classList.add('a');document.getElementById('bV').className=risp[cur]=='V'?'s':'';document.getElementById('bF').className=risp[cur]=='F'?'s':'';}
function an(v){risp[cur]=v;re();if(cur<aQs.length-1){setTimeout(()=>{cur++;re();},200);}}
function nx(){if(cur<aQs.length-1){cur++;re();}}function pr(){if(cur>0){cur--;re();}}
function ch(){let ok=0;for(let i=0;i<aQs.length;i++)if(risp[i]==aQs[i].ans)ok++;else if(risp[i])errs.push(aQs[i]);let er=aQs.length-ok;alert('Sahi: '+ok+'/'+aQs.length+'\nGhalat: '+er+'\n'+(er<=3?'PROMOSSO - Mubarak!':'BOCCIATO'));}
function rc(){let h='';caps.forEach(c=>{let cnt=qs.filter(q=>q.cap==c.id).length;h+=`<div style='border:1.5px solid #009246;border-radius:7px;padding:8px;cursor:pointer;background:#fff' onclick="oq('cap',${c.id})"><b>Cap ${c.id} - ${c.ur} (${cnt})</b><br><small style='color:#666'>${c.it}</small></div>`;});document.getElementById('capList').innerHTML=h;let a='';caps.forEach(c=>{let cnt=qs.filter(q=>q.cap==c.id).length;a+=`<div style='border:1px solid #ccc;padding:7px;margin-bottom:5px;border-radius:7px'><b>Cap ${c.id}: ${c.it}</b> - ${c.ur} (${cnt})<br><button onclick="oq('cap',${c.id})" style='background:#009246;color:#fff;border:none;padding:4px 9px;border-radius:4px;margin-top:4px;cursor:pointer'>Quiz ${c.ur}</button></div>`;});document.getElementById('argList').innerHTML=a;}
rc();gh();
</script></body></html>
