<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patente B - Finale 30Q 20Min</title>
<style>
*{box-sizing:border-box; font-family:Arial}
body{margin:0; background:#d9e4d9; display:flex; justify-content:center}
#app{width:100%; max-width:1000px; background:#eef3ee; border:1px solid #aaa; min-height:100vh}
.header{display:flex; background:#eef3ee; border-bottom:1px solid #bbb}
.header div{flex:1; padding:8px; text-align:center; font-size:13px; border-right:1px solid #bbb; background:#f5f5f5}
.header div.active{background:white; font-weight:bold; border-bottom:2px solid #000}
.nums{display:flex; background:white; border-bottom:1px solid #bbb}
.nums div{flex:1; text-align:center; padding:10px 0; font-weight:bold; border-right:1px solid #ddd; background:#f9f9f9; cursor:pointer}
.nums div.active{background:white; border-bottom:3px solid #000}
.subnums{display:flex; background:#e0e0e0; font-size:10px}
.subnums div{flex:1; text-align:center; padding:4px 0; border-right:1px solid #ccc; cursor:pointer}
.subnums div.active{background:white; font-weight:bold}
.main{display:flex; background:white; min-height:320px}
.left{width:32%; border-right:1px solid #bbb; display:flex; align-items:center; justify-content:center; padding:15px; background:white}
.left img{max-width:100%; max-height:220px}
.right{width:68%; padding:15px; position:relative}
.right .numR{position:absolute; right:10px; top:10px; font-weight:bold; font-size:20px; color:#555}
.q{font-size:16px; margin-top:30px}
.urdu{color:#b00000; background:#fff0f0; padding:6px; border-radius:5px; margin-top:10px; font-weight:bold; font-size:13px}
.footer{display:flex; align-items:center; padding:10px; background:#e8efe8; border-top:1px solid #bbb}
.vf{display:flex; gap:15px; margin:auto}
.vf button{width:65px; height:65px; border:2px solid #333; background:white; border-radius:4px; font-size:0; position:relative; cursor:pointer}
.vf button::after{content:"V"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:40px; border:2px solid #333; border-radius:50%; width:45px; height:45px; line-height:45px}
.vf button#btnF::after{content:"F"}
.vf button.sel{background:#c8e6c9; border-color:green}
.vf button.sel::after{border-color:green}
